<text x="62" y="1072" font-size="16" font-weight="700" fill="#6b5200" text-anchor="start">동시 요청이 몰릴 때 이 구조의 동작</text>
<text x="62" y="1100" font-size="14" font-weight="400" fill="#333" text-anchor="start">· 동시 N건이 도착하면 9건은 줄을 서서 도착 순서대로 한 번에 하나씩 처리하고, 나머지는 즉시 HTTP 503 (측정 21: 동시 12건에서 반복마다 9건 200, 3건 503)</text>
<text x="62" y="1124" font-size="14" font-weight="400" fill="#333" text-anchor="start">· 측정 21: 503 응답 0.01초, 처리된 9건은 약 2.7~2.8초 간격으로 끝남(첫 요청 2.51·2.91초, 9번째 24.07·25.51초). 평상시 계산(9 × 2.67 = 24.0초)과 맞음</text>
<text x="62" y="1148" font-size="14" font-weight="400" fill="#333" text-anchor="start">· 상한 9는 지금까지 측정한 최대값(콜드 스타트 21.48초, 요청당 서비스 시간 3.65초) 기준: 9번째 요청이 21.48 + 9 × 3.65 = 54.3초에 끝나 대기 상한 55초 안 (계산)</text>
<text x="62" y="1172" font-size="14" font-weight="400" fill="#333" text-anchor="start">· 측정한 최대값을 넘으면(콜드 스타트 21.48초 초과, 서비스 시간 3.65초 초과, Throttled) 줄 뒤쪽 요청은 55초를 기다린 뒤 503 (줄이 가득 찬 즉시 거절과 결과는 같고 늦게 실패)</text>
<text x="62" y="1200" font-size="13" font-weight="400" fill="#9a2f2c" text-anchor="start">확인하지 못함: 콜드 스타트와 겹칠 때의 실제 동작, 서버 로그의 WARNING 횟수, BE가 503을 전달하는 방식, ECS Task가 여러 개일 때 Task별로 줄이 생기는 영향</text>
