# 포토미션 verify 3차 LoRA 학습. 2차 뒤 늘어난 닮은 장소 치명 FP(동궁과월지↔월정교)를 줄이려고 반대 장소 미션 예제를 더했다
# 데이터: 2차 677개 + 경주 Q4 yes 동궁과월지·월정교 사진의 반대 장소 미션 50개 = 727개 (사진은 2차와 같은 558장)
# 설정은 1·2차와 같고 데이터·저장 폴더만 다르다. 1차 어댑터에 이어 학습하지 않고 기본 모델부터 다시 학습한다
# 실행: llamafactory-cli train scripts/train/qwen2_5vl_lora_gj3.yaml
# epoch 선택: 2차와 같은 규칙(T7 train/decisions/gj2_epoch_rule.md)으로 1·2·3 epoch 중 고른다
# 매개변수 이름·데이터 형식은 LLaMA-Factory 커밋 1fded91(0.9.6.dev0)의 소스와 대조해 확인함(2026-10-11). Pod에서도 이 커밋으로 설치할 것

### 모델
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 1048576  # 1024 x 1024. 서비스 normalize_image(긴 변 1024)와 같은 크기로 학습
trust_remote_code: true

### 방법: LoRA, 비전 인코더는 그대로 두고 언어 쪽만 학습
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
freeze_vision_tower: true

### 데이터
dataset: photomission_gj3
dataset_dir: /workspace/dataset_gj3  # Pod 네트워크 볼륨 경로. 학습이 끝나면 사진(images/)을 지운다
template: qwen2_vl
cutoff_len: 4096  # 사진 1장 약 1,300토큰 + 지시문 약 700토큰 + 답 약 30토큰
preprocessing_num_workers: 4
overwrite_cache: true

### 저장
output_dir: /workspace/out/qwen2_5vl_lora_gj3
logging_steps: 1
save_strategy: epoch  # epoch마다 checkpoint. Pod를 끄기 전에 T7로 모두 내려받는다 (1차는 못 받아 epoch 비교를 못 함)
plot_loss: true
overwrite_output_dir: true
report_to: none

### 학습: 727개 × 3번. 1 step = 4개라 약 546 step (2차 속도 508 step 72분으로 약 77분)
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
