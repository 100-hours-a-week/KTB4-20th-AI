# 포토미션 verify 1차 LoRA 학습. 결과는 dev 평가로 학습 전 모델과 비교한다
# 데이터: scripts/build_train_dataset.py가 만든 550 세트 511개 전부 (객관식 형식, scripts/question_format.py)
# 설정은 시험 학습(qwen2_5vl_lora_smoke.yaml, 2026-11-06 통과)과 같고 데이터 개수·저장 폴더만 다르다
# 실행: llamafactory-cli train scripts/train/qwen2_5vl_lora_550.yaml
# 매개변수 이름·데이터 형식은 LLaMA-Factory 커밋 1fded91(0.9.6.dev0)의 소스와 대조해 확인함(2026-10-11). Pod에서도 이 커밋으로 설치할 것

### 모델
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 1048576  # 1024 x 1024. 서비스 normalize_image(긴 변 1024)와 같은 크기로 학습
trust_remote_code: true

### 방법: LoRA, 비전 인코더는 그대로 두고 언어 쪽만 학습
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
freeze_vision_tower: true

### 데이터
dataset: photomission_550
dataset_dir: /workspace/dataset_550  # Pod 네트워크 볼륨 경로. 학습이 끝나면 사진(images/)을 지운다
template: qwen2_vl
cutoff_len: 4096  # 사진 1장 약 1,300토큰 + 지시문 약 700토큰 + 답 약 30토큰
preprocessing_num_workers: 4
overwrite_cache: true

### 저장
output_dir: /workspace/out/qwen2_5vl_lora_550
logging_steps: 1
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
report_to: none

### 학습: 511개 × 3번. 1 step = 4개라 약 384 step (시험 학습 속도로 약 50~60분)
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
