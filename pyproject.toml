[project]
name = "ktb4-ai-server"
version = "1.0.2"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "dbutils>=3.2.0",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "sentry-sdk[fastapi]>=2.71.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
addopts = '-m "not exhaustive"'
markers = [
    "exhaustive: 실제 수집 데이터가 필요한 전체 조합 테스트. 약 25~30분 소요. 실행: pytest -m exhaustive",
]