name: "🚀 기능 개발"
description: "새로운 기능을 구현합니다."
title: "[Feature] "
labels:
  - "feature"
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능 구현을 위한 이슈입니다.
        구현하려는 기능의 목적과 완료 조건을 명확하게 작성해주세요.

  - type: textarea
    id: problem
    attributes:
      label: "📌 문제 상황"
      description: "현재 어떤 문제 또는 요구사항이 있는지 작성해주세요."
      placeholder: |
        예) 사용자 요청을 받아 LLM 응답을 검증하는 기능이 없음.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 구현 내용"
      description: "문제를 해결하기 위해 구현할 기능을 작성해주세요."
      placeholder: |
        예) 요청을 받아 LLM을 호출하고 결과를 검증해 응답하는 API를 구현함.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 상세 작업"
      description: "구현해야 할 작업을 체크리스트 형태로 작성해주세요."
      placeholder: |
        - [ ] 요청 스키마 정의
        - [ ] LLM 호출 로직 구현
        - [ ] 응답 검증 로직 구현
        - [ ] 라우터 구현
        - [ ] 테스트 코드 작성
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🎯 완료 조건"
      description: "이 이슈가 완료되었다고 판단할 수 있는 조건을 작성해주세요."
      placeholder: |
        - 정상 요청 시 기대한 형식의 응답이 반환됨
        - 잘못된 입력 시 적절한 오류가 반환됨
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "📎 참고 자료"
      description: "관련 이슈, 문서, API 명세, 디자인 등이 있다면 작성해주세요."
      placeholder: |
        - 관련 이슈: #123
        - API 명세:
