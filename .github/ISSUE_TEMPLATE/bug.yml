name: "🐛 버그 수정"
description: "예상과 다르게 동작하는 기능을 수정합니다."
title: "[Bug] "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        버그 발생 상황을 가능한 한 구체적으로 작성해주세요.

        ```
        ⚠️ Access Token, Refresh Token, API Key, 비밀번호,
        DB 접속정보 등의 민감정보는 첨부하지 마세요.
        ```

  - type: textarea
    id: description
    attributes:
      label: "🐛 문제 설명"
      description: "어떤 문제가 발생했는지 작성해주세요."
      placeholder: |
        예) LLM 호출 API 요청 시 500 Internal Server Error가 발생함.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "🔄 재현 방법"
      description: "문제를 재현할 수 있는 과정을 순서대로 작성해주세요."
      placeholder: |
        1. API 요청을 보냄
        2. LLM 응답이 예상 스키마와 맞지 않음
        3. 재시도 후에도 실패함
        4. 500 응답이 발생함
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ 기대 결과"
      description: "정상적인 경우 어떤 동작이 발생해야 하는지 작성해주세요."
      placeholder: |
        정상적인 응답이 반환되어야 함.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ 실제 결과"
      description: "실제로 어떤 결과가 발생했는지 작성해주세요."
      placeholder: |
        500 Internal Server Error가 반환됨.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "📄 로그 및 스크린샷"
      description: "문제 해결에 도움이 되는 로그 또는 스크린샷을 첨부해주세요."
      placeholder: |
        민감정보를 제거한 뒤 로그를 첨부해주세요.

  - type: textarea
    id: additional
    attributes:
      label: "📎 추가 정보"
      description: "관련 이슈 또는 추가로 공유할 내용이 있다면 작성해주세요."
