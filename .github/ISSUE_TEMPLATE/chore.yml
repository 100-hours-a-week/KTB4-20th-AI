name: "🛠 기타 작업"
description: "빌드, 환경설정, 의존성, CI/CD 등의 작업을 진행합니다."
title: "[Chore] "
labels:
  - "chore"
body:
  - type: markdown
    attributes:
      value: |
        기능 개발이나 버그 수정에 직접 해당하지 않는
        개발 환경 및 프로젝트 관리 작업을 위한 이슈입니다.

  - type: dropdown
    id: category
    attributes:
      label: "📂 작업 유형"
      description: "작업 유형을 선택해주세요."
      options:
        - "패키지 관리 / uv"
        - "Dependency"
        - "Docker"
        - "CI/CD"
        - "환경 변수"
        - "Formatter / Lint (ruff)"
        - "GitHub 설정"
        - "프로젝트 구조"
        - "기타"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📌 작업 내용"
      description: "수행하려는 작업을 작성해주세요."
      placeholder: |
        예) GitHub Actions를 이용한 테스트 자동화를 설정함.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "🎯 작업 목적"
      description: "이 작업이 필요한 이유를 작성해주세요."
      placeholder: |
        PR Merge 이전에 테스트 실패 여부를 자동으로 확인하기 위함.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 상세 작업"
      placeholder: |
        - [ ] GitHub Actions workflow 작성
        - [ ] pytest 실행
        - [ ] 실패 시 Merge 제한 확인

  - type: textarea
    id: impact
    attributes:
      label: "🔍 영향 범위"
      description: "해당 변경으로 영향을 받을 수 있는 부분이 있다면 작성해주세요."
      placeholder: |
        예) PR workflow, pyproject.toml
